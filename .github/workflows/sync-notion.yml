name: Sync Notion

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: notion-content-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      # The sync deploy key is the only actor allowed to bypass the main branch rules.
      # Content sync is independent of the UI Site QA check, which still gates code PRs.
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: main
          ssh-key: ${{ secrets.SYNC_DEPLOY_KEY }}

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Sync published Notion posts
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATA_SOURCE_ID: ${{ secrets.NOTION_DATA_SOURCE_ID }}
        run: node scripts/sync-notion.mjs

      - name: Publish content to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html posts.json posts assets
          if git diff --cached --quiet; then
            echo "No changes to publish."
            exit 0
          fi
          git commit -m "chore: sync published posts from Notion"
          # main may have moved while the sync ran (for example a merged code PR).
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 5
          done
          echo "Could not push the content update to main."
          exit 1
